[project]
name = "warehouse-pick-zone-demo"
version = "0.1.0"
description = "Local real-time warehouse pick-zone counting demo"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "opencv-python==5.0.0.93",
  "onnxruntime==1.30.0",
  "openpyxl==3.1.5",
  "pydantic==2.13.5",
  "numpy==2.5.3",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "playwright==1.63.0",
  "ruff==0.16.10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
